services:
  mongodb:
    image: mongo:7
    container_name: plaans_mongodb
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db

  api:
    build: .
    container_name: plaans_django_api
    restart: unless-stopped
    ports:
      - "8088:8000"
    environment:
      - DJANGO_DEBUG=True
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0,api
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DB_NAME=plaans_db
    depends_on:
      - mongodb

volumes:
  mongo_data:
