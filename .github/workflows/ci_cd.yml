name: Plaans Full-Stack CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Job 1: Flutter Frontend — Dependencies, Static Analysis, Tests & Web Build
  # ──────────────────────────────────────────────────────────────────────────
  flutter-ci:
    name: Flutter Analyze, Test & Web Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify Flutter & Dart versions
        run: flutter --version

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Run Flutter static analysis
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter unit & widget tests
        run: flutter test --reporter expanded

      - name: Build production Flutter Web bundle
        run: |
          flutter build web --release \
            --dart-define=PLAANS_API_URL=${{ vars.PLAANS_API_URL || 'http://localhost:8088/api' }}

      - name: Upload compiled Flutter Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: plaans-web-release
          path: build/web
          retention-days: 14

  # ──────────────────────────────────────────────────────────────────────────
  # Job 2: Django + MongoDB 7 Backend — System Check, Live Mongo & Fallback Tests
  # ──────────────────────────────────────────────────────────────────────────
  backend-ci:
    name: Django REST API & MongoDB 7 Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django system check
        env:
          DJANGO_SECRET_KEY: ci-test-secret-key
          DJANGO_DEBUG: "False"
          MONGODB_URI: mongodb://localhost:27017
          MONGODB_DB_NAME: plaans_ci_test
        run: python manage.py check

      - name: Run Django REST API tests against live MongoDB 7 service
        env:
          DJANGO_SECRET_KEY: ci-test-secret-key
          DJANGO_DEBUG: "True"
          MONGODB_URI: mongodb://localhost:27017
          MONGODB_DB_NAME: plaans_ci_test
        run: python manage.py test --verbosity 2

      - name: Run Django REST API tests in offline in-memory fallback mode
        env:
          DJANGO_SECRET_KEY: ci-test-secret-key
          DJANGO_DEBUG: "True"
          MONGODB_URI: mongodb://localhost:27999
          MONGODB_DB_NAME: plaans_ci_fallback
        run: python manage.py test --verbosity 2

  # ──────────────────────────────────────────────────────────────────────────
  # Job 3: Full-Stack Docker Compose Build & End-to-End Smoke Verification
  # ──────────────────────────────────────────────────────────────────────────
  docker-smoke-test:
    name: Docker Compose Build & Full-Stack Smoke Test
    runs-on: ubuntu-latest
    needs:
      - flutter-ci
      - backend-ci
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download compiled Flutter Web artifact
        uses: actions/download-artifact@v4
        with:
          name: plaans-web-release
          path: build/web

      - name: Build and start Docker Compose stack (MongoDB 7 + Django API + Nginx Web)
        run: docker compose up -d --build

      - name: Wait for Django + MongoDB API health endpoint (/api/health/)
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8088/api/health/ | grep -q '"status": *"ok"'; then
              echo "Backend API is healthy:"
              curl -fsS http://localhost:8088/api/health/
              break
            fi
            echo "Waiting for API container ($i/30)..."
            sleep 2
          done
          curl -fsS http://localhost:8088/api/health/ | grep -q '"storageEngine": *"mongodb"'

      - name: Verify Nginx Web container serves Flutter Web app on port 8099
        run: |
          curl -fsSI http://localhost:8099/
          curl -fsS http://localhost:8099/ | grep -qi "plaans"

      - name: Print container logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down Docker Compose stack
        if: always()
        run: docker compose down -v
