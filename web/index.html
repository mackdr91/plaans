<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Plaans — Build and share mobile-first itineraries, travel guides, and weekend plans with one-tap Google Maps and Apple Maps GPS links.">
  <meta name="theme-color" content="#FAF9F6">

  <!-- iOS & Mobile Web App meta tags -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Plaans">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Preconnect to Google Fonts & OpenStreetMap tiles for faster mobile first paint -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Favicon & Manifest -->
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <title>Plaans — Shareable Itineraries &amp; GPS Plans</title>

  <style>
    :root {
      --bg-surface: #FAF9F6;
      --ink-primary: #1D1D28;
      --ink-muted: #6E6E80;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      background-color: var(--bg-surface);
      color: var(--ink-primary);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior-y: none;
    }

    .boot-shell {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
      gap: 0.75rem;
    }

    .boot-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.4rem 0.9rem;
      border-radius: 999px;
      background: #1D1D28;
      color: #FFFFFF;
      font-weight: 800;
      font-size: clamp(0.85rem, 0.8rem + 0.25vw, 1rem);
      letter-spacing: -0.02em;
    }

    .boot-title {
      margin: 0;
      font-size: clamp(1.35rem, 1.1rem + 1.2vw, 2rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      text-wrap: balance;
    }

    .boot-subtitle {
      margin: 0;
      max-width: 34ch;
      font-size: clamp(0.875rem, 0.82rem + 0.25vw, 1rem);
      color: var(--ink-muted);
    }
  </style>
</head>
<body>
  <main id="plaans-boot-shell" class="boot-shell" aria-busy="true">
    <span class="boot-badge">@plaans</span>
    <h1 class="boot-title">Loading your itinerary studio&hellip;</h1>
    <p class="boot-subtitle">Preparing mobile-first blocks, themes &amp; GPS links.</p>
  </main>

  <script src="flutter_bootstrap.js" async fetchpriority="high"></script>
</body>
</html>
